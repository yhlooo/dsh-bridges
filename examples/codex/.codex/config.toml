# Codex project-layer config read by the dsh-bridges codex bridge.
# TOML comments like this one are legal.

# Cap the concatenated project AGENTS.md chain (Codex default: 32768).
# Keep this at the top level: TOML table context persists across blank
# lines, so keys written after [[skills.config]] belong to that table.
project_doc_max_bytes = 32768

# Disable the demo skill so discovery skips it (relative paths resolve
# against this file's directory, .codex/).
[[skills.config]]
path = "../.agents/skills/legacy-helper"
enabled = false

# Uncomment to disable every hook from the most specific layer:
# [features]
# hooks = false

# Approval / sandbox policy bridged to DSH session knobs (see README):
# sandbox_mode values map 1:1 onto DeepSeek Harness sandbox modes, and
# approval_policy "never" maps to auto-approve while the rest map to ask.
sandbox_mode = "workspace-write"
approval_policy = "on-request"

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm typecheck:e2e
      - run: pnpm build
      - run: pnpm test
      - run: pnpm test:e2e
      - run: pnpm test:coverage
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm audit
      - run: npm pack --dry-run

      - name: Install the dsh CLI for the pack smoke
        run: npm i -g @deepseek-ai/dsh@0.1.0-rc.6
      - run: pnpm smoke
